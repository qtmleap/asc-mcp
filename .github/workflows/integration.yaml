name: Integration
on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      test-os:
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      skip-docker:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: integration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.test-os || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests and offline Go request compatibility fixtures
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --locked
      - name: CLI smoke
        run: cargo run --locked -- version

  docker:
    if: ${{ !inputs.skip-docker }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: asc-mcp-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Distroless native binary smoke
        run: docker run --rm asc-mcp-ci:latest version
      - name: Default HTTP sidecar smoke
        run: |
          sidecar_id=$(docker run -d -e ASC_MCP_AUTH_TOKENS=ci-sidecar-token -p 127.0.0.1::8080 asc-mcp-ci:latest)
          trap 'docker rm -f "$sidecar_id" >/dev/null 2>&1 || true' EXIT
          sidecar_port=$(docker port "$sidecar_id" 8080/tcp | sed 's/.*://')
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 "http://127.0.0.1:$sidecar_port/healthz"
          http_status=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{}' "http://127.0.0.1:$sidecar_port/mcp")
          test "$http_status" = 401
          curl --fail --silent --show-error -H 'Authorization: Bearer ci-sidecar-token' -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-sidecar-smoke","version":"1"}}}' \
            "http://127.0.0.1:$sidecar_port/mcp" | python3 -c 'import json,sys; response=json.load(sys.stdin); assert response["result"]["serverInfo"]["name"] == "asc-mcp"'
      - name: Compose configuration
        run: ./script/docker/compose.sh standalone config -q
