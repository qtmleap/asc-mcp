name: Integration
on:
  push:
    branches-ignore: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      test-os:
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      skip-docker:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: integration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.test-os || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests and offline Go request compatibility fixtures
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --locked
      - name: CLI smoke
        run: cargo run --locked -- version

  docker:
    if: ${{ !inputs.skip-docker }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: asc-mcp-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Distroless native binary smoke
        run: docker run --rm asc-mcp-ci:latest version
      - name: Compose configuration
        run: ./script/docker/compose.sh standalone config -q
