name: Deployment
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  verify:
    uses: ./.github/workflows/integration.yaml
    with:
      skip-docker: true
      test-os: '["Linux"]'
  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    # Manual runs on development branches must not replace release tags.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: linux-amd64
          - platform: linux/arm64
            artifact: linux-arm64
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: ${{ matrix.platform == 'linux/arm64' && 90 || 25 }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=deployment-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=deployment-${{ matrix.artifact }}
      - name: Smoke the published architecture
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: docker run --rm --platform "$IMAGE_PLATFORM" "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" version
      - name: Export digest
        id: digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          digest_dir=$(mktemp -d "${RUNNER_TEMP:?}/asc-digest.XXXXXX")
          printf 'path=%s\n' "$digest_dir" >> "$GITHUB_OUTPUT"
          touch "$digest_dir/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ steps.digest.outputs.path }}/*
          if-no-files-found: error
          retention-days: 1
      - name: Remove exported digest directory
        if: always() && steps.digest.outputs.path != ''
        env:
          DIGEST_DIR: ${{ steps.digest.outputs.path }}
        run: rm -rf -- "$DIGEST_DIR"
  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Read package version and validate release tag
        id: package
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_NAME" != "v$VERSION" ]]; then
            echo 'Release tag must match Cargo.toml version' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Allocate digest download directory
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          digest_dir=$(mktemp -d "${RUNNER_TEMP:?}/asc-publish-digests.XXXXXX")
          printf 'path=%s\n' "$digest_dir" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ steps.digests.outputs.path }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.package.outputs.version }}
            type=raw,value=v${{ steps.package.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Publish multi-platform manifest
        shell: bash
        working-directory: ${{ steps.digests.outputs.path }}
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          digests=(*)
          [[ ${#digests[@]} == 2 ]]
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ && -f "$digest" && ! -L "$digest" && ! -s "$digest" ]]
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          candidate=$(mktemp "${RUNNER_TEMP:?}/asc-manifest-candidate.XXXXXX")
          published=$(mktemp "${RUNNER_TEMP:?}/asc-manifest-published.XXXXXX")
          trap 'rm -f -- "$candidate" "$published"' EXIT
          docker buildx imagetools create --dry-run "${sources[@]}" > "$candidate"
          jq -e '
            ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"]
            and all(.manifests[];
              (.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))
              or (.platform.os == "unknown" and .platform.architecture == "unknown"
                and .annotations["vnd.docker.reference.type"] == "attestation-manifest"))
          ' "$candidate"
          jq -e '.tags | type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" --raw > "$published"
          jq -e --slurpfile candidate "$candidate" '
            (.manifests | sort_by(.digest)) == ($candidate[0].manifests | sort_by(.digest))
          ' "$published"
      - name: Remove downloaded digest directory
        if: always() && steps.digests.outputs.path != ''
        env:
          DIGEST_DIR: ${{ steps.digests.outputs.path }}
        run: rm -rf -- "$DIGEST_DIR"
