name: Deployment
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  verify:
    uses: ./.github/workflows/integration.yaml
    with:
      skip-docker: true
      test-os: '["ubuntu-latest"]'
  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    # Manual runs on development branches must not replace release tags.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=deployment-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=deployment-${{ matrix.artifact }}
      - name: Smoke the published architecture
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" version
      - name: Export digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Read package version and validate release tag
        id: package
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_NAME" != "v$VERSION" ]]; then
            echo 'Release tag must match Cargo.toml version' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.package.outputs.version }}
            type=raw,value=v${{ steps.package.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Publish multi-platform manifest
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in *; do args+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"
      - name: Verify manifest contains amd64 and arm64
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" --raw > /tmp/manifest.json
          jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | unique | sort) == ["amd64", "arm64"]' /tmp/manifest.json
