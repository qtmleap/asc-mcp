name: Rust release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build artifacts without publishing a release
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, macOS, Windows]
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/asc-mcp.exe dist/
          else
            cp target/release/asc-mcp dist/
          fi
          cp LICENSE README.md dist/
          tar -czf "asc-mcp-${{ runner.os }}-${{ runner.arch }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: asc-mcp-${{ runner.os }}-${{ runner.arch }}
          path: asc-mcp-*.tar.gz
  publish:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/') && !inputs.snapshot
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: asc-mcp-*
          merge-multiple: true
          path: release-assets
      - name: Publish tagged release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/*.tar.gz --clobber
