[package]
name = "asc-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rust MCP server for App Store Connect and reviewer monitoring"
repository = "https://github.com/qtmleap/asc-mcp"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
hex = "0.4"
jsonwebtoken = "9"
md5 = "0.7"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }
num-bigint = { version = "0.4", features = ["rand"] }
rand = "0.8"
pbkdf2 = "0.12"
sha1 = "0.10"
rpassword = "7"
zeroize = "1"
cookie = "0.18"
fs2 = "0.4"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
httpmock = "0.8"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
